name: dota-stats-lab

services:
  test:
    build:
      context: .
      target: test
    image: dota-stats-lab-test:local

  e2e:
    build:
      context: .
      target: e2e
    image: dota-stats-lab-e2e:local
    environment:
      PLAYWRIGHT_BASE_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    image: dota-stats-lab-web:local
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    ports:
      - "127.0.0.1:3400:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - type: volume
        source: replays
        target: /data/replays
      - type: volume
        source: staging
        target: /work/staging
      - type: volume
        source: warehouse
        target: /data/warehouse
      - type: volume
        source: queries
        target: /data/queries

  fetch:
    build:
      context: .
      target: app
    image: dota-stats-lab-app:local
    command: ["fetch"]
    init: true
    volumes:
      - type: volume
        source: replays
        target: /data/replays

  parser:
    build:
      context: .
      target: parser
    image: dota-stats-lab-parser:local
    command: []
    init: true
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2304m,mode=1777
    volumes:
      - type: volume
        source: replays
        target: /data/replays
        read_only: true
      - type: volume
        source: staging
        target: /work/staging

  parser-worker:
    build:
      context: .
      target: parser-worker
    image: dota-stats-lab-parser-worker:local
    command: ["parser-worker"]
    init: true
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2304m,mode=1777
    volumes:
      - type: volume
        source: replays
        target: /data/replays
        read_only: true
      - type: volume
        source: staging
        target: /work/staging

  loader:
    build:
      context: .
      target: app
    image: dota-stats-lab-app:local
    command: ["load"]
    init: true
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - type: volume
        source: staging
        target: /work/staging
      - type: volume
        source: warehouse
        target: /data/warehouse

volumes:
  replays:
    name: dota-stats-replays
    external: true
  warehouse:
    name: dota-stats-warehouse
    external: true
  staging:
    name: dota-stats-staging
  queries:
    name: dota-stats-queries
    external: true
